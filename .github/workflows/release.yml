name: Verify and release installer

on:
  push:
    branches:
      - main
      - espnow-support
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify coordinated firmware
        run: python update_firmware.py
      - name: Check installer
        run: |
          python -m py_compile packages/esp32-p4-firmware-installer/enable_espnow.py
          for device in dev waveshare; do
            for espnow in no yes; do
              python packages/esp32-p4-firmware-installer/enable_espnow.py TESTPORT \
                --device "$device" --espnow "$espnow" --dry-run
            done
          done
      - name: Build deterministic release archive
        run: python tools/build_release.py
      - name: Test archive
        run: unzip -t packages/esp32-p4-firmware-installer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-p4-firmware-installer
          path: |
            packages/esp32-p4-firmware-installer.zip
            packages/esp32-p4-firmware-installer.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp32-p4-firmware-installer
          path: packages
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packages/esp32-p4-firmware-installer.zip \
            packages/esp32-p4-firmware-installer.zip.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
